<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3ea" id="meta-theme">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Mis Aventuras RD: diario de viaje, mapa y presupuesto de tus destinos en la República Dominicana.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mis Aventuras RD">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23146c54'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%23fff' stroke-width='4'/%3E%3Cpath d='M39 25 34 34 25 39 30 30z' fill='%23fff'/%3E%3C/svg%3E">
  <title>Mis Aventuras RD — Diario de viaje</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>
    /* Aplica el tema guardado antes del primer pintado para evitar destellos. */
    (function () {
      try {
        var t = localStorage.getItem("mar-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) { /* almacenamiento no disponible */ }
    }());
  </script>
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">

  <symbol id="i-edit" viewBox="0 0 24 24">

  </symbol>
  <symbol id="i-share" viewBox="0 0 24 24">
    <circle cx="18" cy="5" r="3"></circle>
    <circle cx="6" cy="12" r="3"></circle>
    <circle cx="18" cy="19" r="3"></circle>
    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>

  <symbol id="i-check" viewBox="0 0 24 24">

    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>

  <symbol id="i-star" viewBox="0 0 24 24">
    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
  </symbol>
  <symbol id="i-chevron-left" viewBox="0 0 24 24">
    <polyline points="15 18 9 12 15 6"></polyline>
  </symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24">
    <polyline points="9 18 15 12 9 6"></polyline>
  </symbol>
  <symbol id="i-database" viewBox="0 0 24 24">
    <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>

    <path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"></path>

  <symbol id="i-calendar" viewBox="0 0 24 24">

    <line x1="3" y1="10" x2="21" y2="10"></line>

  <symbol id="i-wallet" viewBox="0 0 24 24">

    <path d="M18 12a2 2 0 0 0 0 4h4v-4Z"></path>
  </symbol>
  <symbol id="i-external" viewBox="0 0 24 24">

    <polyline points="15 3 21 3 21 9"></polyline>

  </symbol>
  <symbol id="i-copy" viewBox="0 0 24 24">
    <rect x="9" y="9" width="13" height="13" rx="2"></rect>
    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
  </symbol>
  <symbol id="i-info" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9.5"></circle>
    <line x1="12" y1="16" x2="12" y2="11.5"></line>
    <line x1="12" y1="8" x2="12.01" y2="8"></line>
  </symbol>
  <symbol id="i-layers" viewBox="0 0 24 24">
    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
    <polyline points="2 17 12 22 22 17"></polyline>
    <polyline points="2 12 12 17 22 12"></polyline>
  </symbol>
  <symbol id="i-settings" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="3"></circle>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>

</svg>

<main class="app" id="app">

  <div id="map" role="application" aria-label="Mapa interactivo de la República Dominicana" tabindex="0">
    <svg id="map-svg" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="landGradient" x1="0" y1="0" x2="0.42" y2="1">
          <stop offset="0" style="stop-color:var(--land-1)"></stop>
          <stop offset="1" style="stop-color:var(--land-2)"></stop>
        </linearGradient>
      </defs>
      <g id="world">
        <g id="geo-layer">
          <path id="coast-glow" d="" aria-hidden="true"></path>
          <path id="land" d="" aria-label="Contorno de la República Dominicana"></path>
        </g>
        <g id="map-labels" aria-hidden="true">
          <text id="country-label" class="country-label" x="0" y="0">
            <tspan x="0" dy="0">REPÚBLICA</tspan>
            <tspan x="0" dy="1.16em">DOMINICANA</tspan>
          </text>
          <text id="sea-caribbean" class="sea-label" x="0" y="0">MAR CARIBE</text>
          <text id="sea-atlantic" class="sea-label" x="0" y="0">OCÉANO ATLÁNTICO</text>
          <g id="city-layer"></g>
        </g>
      </g>
    </svg>

    <div id="markers" role="group" aria-label="Destinos en el mapa"></div>
  </div>

  <header class="topbar" id="topbar">
    <div class="panel">
      <div class="brand-row">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg class="ic"><use href="#i-compass"></use></svg>
          </span>
          <div class="brand-text">
            <h1>Mis Aventuras</h1>
            <p>República Dominicana</p>
          </div>
        </div>
        <div class="top-actions">
          <button class="icon-btn" type="button" data-action="toggle-theme" aria-label="Cambiar tema" title="Cambiar tema">
            <svg class="ic" id="theme-icon"><use href="#i-moon"></use></svg>
          </button>
          <button class="icon-btn" type="button" id="gear-btn" data-action="open-gear" aria-label="Copia de seguridad y ajustes" title="Copia de seguridad y ajustes" aria-haspopup="dialog" aria-expanded="false">
            <svg class="ic"><use href="#i-settings"></use></svg>
          </button>
        </div>
      </div>

      <div class="searchbox">
        <svg class="ic" aria-hidden="true"><use href="#i-search"></use></svg>
        <input id="search" type="search" placeholder="Buscar destinos, provincias, notas…" autocomplete="off" spellcheck="false" aria-label="Buscar destinos">
        <button class="clear-search" type="button" data-action="clear-search" aria-label="Limpiar búsqueda" title="Limpiar búsqueda" hidden>
          <svg class="ic"><use href="#i-x"></use></svg>
        </button>
      </div>

      <div class="filter-row">
        <div class="chips" id="chips" role="group" aria-label="Filtrar destinos"></div>
        <span class="count" id="count" aria-live="polite"></span>
      </div>
    </div>
  </header>

  <div class="map-controls" aria-label="Controles del mapa">
    <button class="map-ctrl" type="button" data-action="zoom-in" aria-label="Acercar" title="Acercar">
      <svg class="ic"><use href="#i-plus"></use></svg>
    </button>
    <button class="map-ctrl" type="button" data-action="zoom-out" aria-label="Alejar" title="Alejar">
      <svg class="ic"><use href="#i-minus"></use></svg>
    </button>
    <button class="map-ctrl" type="button" data-action="home" aria-label="Vista general del país" title="Vista general del país">
      <svg class="ic"><use href="#i-home"></use></svg>
    </button>
  </div>

  <div id="placement-bar" class="placement-bar" hidden>
    <span class="placement-icon"><svg class="ic"><use href="#i-pin"></use></svg></span>
    <span class="placement-text">Toca el mapa para colocar el destino<small>Arrastra para moverte y pellizca para acercar.</small></span>
    <button class="icon-btn" type="button" data-action="cancel-placement" aria-label="Cancelar" title="Cancelar">
      <svg class="ic"><use href="#i-x"></use></svg>
    </button>
  </div>

  <button class="fab" type="button" id="add-btn" data-action="add" aria-label="Añadir destino">
    <svg class="ic"><use href="#i-plus"></use></svg>
    <span class="fab-label">Añadir</span>
  </button>

  <div id="hint" class="hint" hidden></div>

  <div id="preview" class="preview" hidden></div>

  <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-label="Panel" hidden></div>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Galería de fotos" hidden></div>

  <div id="dialog" class="dialog" hidden></div>

  <div id="gear-menu" class="gear-menu" role="dialog" aria-modal="true" aria-labelledby="gear-title" hidden>
    <div class="gear-sheet">
      <div class="gear-grab" aria-hidden="true"></div>
      <div class="gear-head">
        <div>
          <h2 id="gear-title">Copia de seguridad</h2>
          <p>Todo se queda en tu teléfono.</p>
        </div>
        <button class="icon-btn" type="button" data-action="close-gear" aria-label="Cerrar" title="Cerrar">
          <svg class="ic"><use href="#i-x"></use></svg>
        </button>
      </div>
      <div class="gear-list">
        <button class="gear-item" type="button" data-action="backup-share">
          <span class="gear-ico"><svg class="ic" aria-hidden="true"><use href="#i-share"></use></svg></span>
          <span class="gear-body"><span class="gear-title">Compartir copia</span><span class="gear-sub">WhatsApp, Drive, Telegram u otras apps.</span></span>
          <svg class="ic gear-chev" aria-hidden="true"><use href="#i-chevron-right"></use></svg>
        </button>
        <button class="gear-item" type="button" data-action="backup-export">
          <span class="gear-ico"><svg class="ic" aria-hidden="true"><use href="#i-zip"></use></svg></span>
          <span class="gear-body"><span class="gear-title">Exportar copia</span><span class="gear-sub">Descarga un ZIP con fecha y hora.</span></span>
          <svg class="ic gear-chev" aria-hidden="true"><use href="#i-chevron-right"></use></svg>
        </button>
        <button class="gear-item" type="button" data-action="backup-import">
          <span class="gear-ico"><svg class="ic" aria-hidden="true"><use href="#i-upload"></use></svg></span>
          <span class="gear-body"><span class="gear-title">Importar copia</span><span class="gear-sub">Restaura un ZIP o un JSON antiguo.</span></span>
          <svg class="ic gear-chev" aria-hidden="true"><use href="#i-chevron-right"></use></svg>
        </button>
      </div>
      <div class="gear-divider" aria-hidden="true"></div>
      <button class="gear-item is-secondary" type="button" data-action="stats">
        <span class="gear-ico"><svg class="ic" aria-hidden="true"><use href="#i-chart"></use></svg></span>
        <span class="gear-body"><span class="gear-title">Estadísticas y datos</span><span class="gear-sub">Progreso, provincias, gastos y almacenamiento.</span></span>
        <svg class="ic gear-chev" aria-hidden="true"><use href="#i-chevron-right"></use></svg>
      </button>
    </div>
  </div>

  <div id="busy" class="busy" role="status" aria-live="polite" hidden>
    <div class="busy-card">
      <div class="busy-spinner" aria-hidden="true"></div>
      <h2 id="busy-title">Preparando copia…</h2>
      <p id="busy-detail">Esto puede tardar un poco.</p>
      <div class="busy-track" id="busy-track" hidden><span id="busy-bar"></span></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <input id="photo-input" type="file" accept="image/*" multiple hidden>
  <input id="camera-input" type="file" accept="image/*" capture="environment" hidden>
  <input id="import-input" type="file" accept=".zip,.json,application/zip,application/json" hidden>
</main>

<script src="assets/js/zip.js" defer></script>
<script src="assets/js/geo-data.js" defer></script>
<script src="assets/js/map.js" defer></script>
<script src="assets/js/app.js" defer></script>
</body>
</html>
