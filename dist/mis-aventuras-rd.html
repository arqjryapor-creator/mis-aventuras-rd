<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Mis Aventuras RD: diario de viaje, mapa y presupuesto de tus destinos en la República Dominicana.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mis Aventuras RD">

  <title>Mis Aventuras RD — Diario de viaje</title>
  <style>
/* ==========================================================================
   Mis Aventuras RD — hoja de estilos principal
   Organización:
     1. Tokens y reset
     2. Mapa (SVG, marcadores, controles)
     3. Barra superior y búsqueda
     4. Tarjetas flotantes (pista, vista previa, FAB)
     5. Overlays: detalle, formulario, estadísticas
     6. Galería de fotos, presupuesto y componentes de formulario
     7. Lightbox, diálogos y avisos
     8. Responsive y preferencias de movimiento
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. Tokens y reset
   -------------------------------------------------------------------------- */
:root {
  color-scheme: light;
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;

  --bg: #f7f3ea;
  --surface: #fffdf8;
  --surface-2: #f0ebdf;
  --surface-3: #e9e3d5;
  --ink: #18241f;
  --ink-soft: #34443c;
  --muted: #6b7a71;
  --line: #e3ddcf;
  --line-strong: #cfc6b4;

  --brand: #146c54;
  --brand-dark: #0e5541;
  --brand-soft: #dceee6;
  --brand-ink: #ffffff;
  --accent: #d97757;
  --accent-soft: #f8e3da;
  --danger: #b53a32;
  --danger-soft: #f8e1df;

  --sea-1: #dcecf2;
  --sea-2: #c6e0e8;
  --sea-glow: #eef7fa;
  --land-1: #faf3e2;
  --land-2: #e9efdc;
  --coast: #55726b;
  --map-label: #445a51;
  --map-halo: rgba(255, 253, 248, 0.92);

  --panel: rgba(255, 253, 248, 0.9);
  --panel-line: rgba(207, 198, 180, 0.6);
  --chip-bg: rgba(255, 253, 248, 0.72);

  --shadow-sm: 0 1px 2px rgba(17, 38, 29, 0.06), 0 6px 18px rgba(17, 38, 29, 0.09);
  --shadow-md: 0 10px 32px rgba(17, 38, 29, 0.14);
  --shadow-lg: 0 24px 70px rgba(17, 38, 29, 0.22);
  --shadow-fab: 0 10px 26px rgba(14, 85, 65, 0.32);

  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 26px;
  --focus: #2f9b7c;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --topbar-space: 176px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111a16;
    --surface: #1a2520;
    --surface-2: #22302a;
    --surface-3: #2a3a33;
    --ink: #edf3ef;
    --ink-soft: #c9d6cf;
    --muted: #96a79e;
    --line: #2c3d35;
    --line-strong: #40554a;

    --brand: #63b996;
    --brand-dark: #8bd0b2;
    --brand-soft: #1d3a2f;
    --brand-ink: #0d1a14;
    --accent: #e79a7d;
    --accent-soft: #3a2922;
    --danger: #ef8b82;
    --danger-soft: #3d2422;

    --sea-1: #13252c;
    --sea-2: #0d1c22;
    --sea-glow: #1c3943;
    --land-1: #26362c;
    --land-2: #1d2e26;
    --coast: #7ba79a;
    --map-label: #a9c3b8;
    --map-halo: rgba(13, 25, 20, 0.88);

    --panel: rgba(23, 34, 28, 0.9);
    --panel-line: rgba(64, 85, 74, 0.65);
    --chip-bg: rgba(26, 37, 32, 0.72);

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.28), 0 8px 22px rgba(0, 0, 0, 0.26);
    --shadow-md: 0 14px 38px rgba(0, 0, 0, 0.34);
    --shadow-lg: 0 28px 80px rgba(0, 0, 0, 0.46);
    --shadow-fab: 0 12px 30px rgba(0, 0, 0, 0.45);
    --focus: #7fd3b4;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111a16;
  --surface: #1a2520;
  --surface-2: #22302a;
  --surface-3: #2a3a33;
  --ink: #edf3ef;
  --ink-soft: #c9d6cf;
  --muted: #96a79e;
  --line: #2c3d35;
  --line-strong: #40554a;

  --brand: #63b996;
  --brand-dark: #8bd0b2;
  --brand-soft: #1d3a2f;
  --brand-ink: #0d1a14;
  --accent: #e79a7d;
  --accent-soft: #3a2922;
  --danger: #ef8b82;
  --danger-soft: #3d2422;

  --sea-1: #13252c;
  --sea-2: #0d1c22;
  --sea-glow: #1c3943;
  --land-1: #26362c;
  --land-2: #1d2e26;
  --coast: #7ba79a;
  --map-label: #a9c3b8;
  --map-halo: rgba(13, 25, 20, 0.88);

  --panel: rgba(23, 34, 28, 0.9);
  --panel-line: rgba(64, 85, 74, 0.65);
  --chip-bg: rgba(26, 37, 32, 0.72);

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.28), 0 8px 22px rgba(0, 0, 0, 0.26);
  --shadow-md: 0 14px 38px rgba(0, 0, 0, 0.34);
  --shadow-lg: 0 28px 80px rgba(0, 0, 0, 0.46);
  --shadow-fab: 0 12px 30px rgba(0, 0, 0, 0.45);
  --focus: #7fd3b4;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 var(--font-sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body.is-locked {
  overflow: hidden;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button {
  border: 0;
  padding: 0;
  background: none;
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

a {
  color: var(--brand);
}

img {
  max-width: 100%;
}

[hidden] {
  display: none !important;
}

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

::selection {
  background: var(--brand);
  color: var(--brand-ink);
}

.sprite {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
}

.ic {
  width: 20px;
  height: 20px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  pointer-events: none;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* --------------------------------------------------------------------------
   2. Mapa
   -------------------------------------------------------------------------- */
#map {
  position: fixed;
  inset: 0;
  overflow: hidden;
  touch-action: none;
  cursor: grab;
  background:
    radial-gradient(110% 85% at 22% 0%, var(--sea-glow) 0%, transparent 56%),
    linear-gradient(158deg, var(--sea-1) 0%, var(--sea-2) 100%);
  -webkit-tap-highlight-color: transparent;
}

#map.is-dragging {
  cursor: grabbing;
}

#map.is-placing {
  cursor: crosshair;
}

#map:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: -4px;
}

#map-svg {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

#world {
  will-change: transform;
}

#land {
  fill: url(#landGradient);
  stroke: var(--coast);
  stroke-width: 1.9;
  stroke-linejoin: round;
  stroke-linecap: round;
  vector-effect: non-scaling-stroke;
}

#coast-glow {
  fill: none;
  stroke: var(--coast);
  stroke-width: 10;
  stroke-linejoin: round;
  stroke-linecap: round;
  opacity: 0.13;
  vector-effect: non-scaling-stroke;
}

.country-label {
  fill: var(--map-label);
  font-family: var(--font-serif);
  font-weight: 600;
  letter-spacing: 0.28em;
  text-anchor: middle;
  paint-order: stroke fill;
  stroke: var(--map-halo);
  stroke-linejoin: round;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

.sea-label {
  fill: var(--map-label);
  font-family: var(--font-sans);
  font-weight: 600;
  letter-spacing: 0.24em;
  text-anchor: middle;
  opacity: 0.42;
  paint-order: stroke fill;
  stroke: var(--map-halo);
  stroke-linejoin: round;
  pointer-events: none;
}

.city {
  pointer-events: none;
  transition: opacity 0.2s ease;
}

.city-dot {
  fill: var(--brand);
  stroke: var(--map-halo);
  vector-effect: non-scaling-stroke;
}

.city-text {
  fill: var(--map-label);
  font-family: var(--font-sans);
  font-weight: 600;
  paint-order: stroke fill;
  stroke: var(--map-halo);
  stroke-linejoin: round;
  dominant-baseline: middle;
}

/* Marcadores ------------------------------------------------------------- */
#markers {
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
}

.marker {
  --shift: 0px;
  position: absolute;
  left: 0;
  top: 0;
  width: 0;
  height: 0;
  pointer-events: none;
  will-change: transform;
}

.marker.is-hidden {
  display: none;
}

.marker.is-selected {
  z-index: 9;
}

.marker-card {
  position: absolute;
  left: 0;
  top: 0;
  width: 124px;
  display: block;
  overflow: visible;
  text-align: left;
  border-radius: 14px;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  transform: translate(calc(-50% + var(--shift, 0px)), calc(-100% - 13px));
  transform-origin: 50% 100%;
  pointer-events: auto;
  isolation: isolate;
  transition: transform 0.16s ease, box-shadow 0.16s ease;
  -webkit-tap-highlight-color: transparent;
}

.marker-card::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -5px;
  width: 11px;
  height: 11px;
  z-index: -1;
  border-radius: 2px;
  background: var(--surface);
  transform: translateX(-50%) rotate(45deg);
  box-shadow: 2px 2px 4px rgba(17, 38, 29, 0.08);
}

.marker-card:hover {
  transform: translate(calc(-50% + var(--shift, 0px)), calc(-100% - 17px));
  box-shadow: var(--shadow-md);
}

.marker.is-selected .marker-card {
  transform: translate(calc(-50% + var(--shift, 0px)), calc(-100% - 17px));
  box-shadow: 0 0 0 2px var(--brand), var(--shadow-md);
}

.marker.is-below .marker-card {
  transform: translate(calc(-50% + var(--shift, 0px)), 13px);
}

.marker.is-below .marker-card:hover,
.marker.is-below.is-selected .marker-card {
  transform: translate(calc(-50% + var(--shift, 0px)), 17px);
}

.marker.is-below .marker-card::after {
  bottom: auto;
  top: -5px;
  box-shadow: -2px -2px 4px rgba(17, 38, 29, 0.08);
}

.marker-card:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
}

.mc-photo {
  position: relative;
  display: block;
  height: 64px;
  overflow: hidden;
  border-radius: 13px 13px 0 0;
  background:
    linear-gradient(140deg, var(--brand-soft), var(--surface-2));
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
}

.mc-photo::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(8, 22, 16, 0.34), transparent 55%);
  pointer-events: none;
}

.mc-placeholder {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--brand);
}

.mc-placeholder .ic {
  width: 25px;
  height: 25px;
  opacity: 0.72;
}

.mc-badge {
  position: absolute;
  top: 6px;
  right: 6px;
  z-index: 2;
  width: 20px;
  height: 20px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: #fff;
  border: 1.5px solid rgba(255, 255, 255, 0.92);
  box-shadow: 0 2px 7px rgba(0, 0, 0, 0.28);
}

.mc-badge .ic {
  width: 11px;
  height: 11px;
  stroke-width: 3;
}

.mc-badge.is-visited {
  background: var(--brand);
}

.mc-badge.is-pending {
  background: #52656c;
}

.mc-name {
  display: block;
  padding: 6px 8px 7px;
  overflow: hidden;
  border-radius: 0 0 13px 13px;
  background: var(--surface);
  font-size: 11.5px;
  font-weight: 650;
  line-height: 1.25;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Clústeres -------------------------------------------------------------- */
.cluster {
  position: absolute;
  left: 0;
  top: 0;
  width: 0;
  height: 0;
  z-index: 7;
  pointer-events: none;
  will-change: transform;
}

.cluster-dot {
  position: absolute;
  left: 0;
  top: 0;
  width: 56px;
  height: 56px;
  margin: -28px 0 0 -28px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--brand);
  color: var(--brand-ink);
  border: 3px solid var(--surface);
  box-shadow: var(--shadow-md);
  pointer-events: auto;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.16s ease, background 0.16s ease;
}

.cluster-dot::before {
  content: "";
  position: absolute;
  inset: -8px;
  border: 2px solid var(--brand);
  border-radius: 50%;
  opacity: 0.22;
}

.cluster-dot:hover {
  transform: scale(1.07);
  background: var(--brand-dark);
}

.cluster-count {
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -0.03em;
}

.cluster-caption {
  position: absolute;
  left: 50%;
  top: 34px;
  transform: translateX(-50%);
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--surface);
  color: var(--muted);
  box-shadow: var(--shadow-sm);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.04em;
  white-space: nowrap;
  pointer-events: none;
}

/* Controles del mapa ----------------------------------------------------- */
.map-controls {
  position: fixed;
  right: 16px;
  bottom: calc(var(--safe-bottom) + 86px);
  z-index: 19;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: bottom 0.25s ease;
}

.app.has-preview .map-controls {
  bottom: calc(var(--safe-bottom) + 122px);
}

.map-ctrl {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--panel-line);
  transition: background 0.15s ease, transform 0.15s ease;
}

.map-ctrl:hover {
  background: var(--surface-2);
}

.map-ctrl:active {
  transform: scale(0.94);
}

.map-ctrl .ic {
  width: 19px;
  height: 19px;
}

.app.has-preview .fab {
  opacity: 0;
  transform: translateY(16px) scale(0.96);
  pointer-events: none;
}

/* --------------------------------------------------------------------------
   3. Barra superior y búsqueda
   -------------------------------------------------------------------------- */
.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 20;
  padding: calc(var(--safe-top) + 10px) 14px 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.app.is-placing .topbar {
  opacity: 0.18;
  transform: translateY(-8px);
  pointer-events: none;
}

.app.is-placing .hint,
.app.is-placing .preview,
.app.is-placing .map-controls,
.app.is-placing .fab {
  opacity: 0;
  pointer-events: none;
}

.panel {
  width: min(100%, 720px);
  margin: 0 auto;
  padding: 12px 14px 11px;
  border: 1px solid var(--panel-line);
  border-radius: var(--radius-lg);
  background: var(--panel);
  box-shadow: var(--shadow-sm);
  -webkit-backdrop-filter: blur(18px) saturate(1.15);
  backdrop-filter: blur(18px) saturate(1.15);
  pointer-events: auto;
}

.brand-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.brand-mark {
  width: 40px;
  height: 40px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 13px;
  background: linear-gradient(145deg, var(--brand), var(--brand-dark));
  color: var(--brand-ink);
  box-shadow: 0 5px 14px rgba(14, 85, 65, 0.24);
}

.brand-mark .ic {
  width: 23px;
  height: 23px;
}

.brand-text {
  min-width: 0;
}

.brand h1 {
  margin: 0;
  font-family: var(--font-serif);
  font-size: 21px;
  font-weight: 600;
  line-height: 1.05;
  letter-spacing: -0.02em;
  white-space: nowrap;
}

.brand p {
  margin: 3px 0 0;
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.top-actions {
  display: flex;
  gap: 6px;
  flex: none;
}

.icon-btn {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: var(--chip-bg);
  border: 1px solid var(--line);
  color: var(--ink-soft);
  transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
}

.icon-btn:hover {
  background: var(--surface-2);
  color: var(--ink);
}

.icon-btn:active {
  transform: scale(0.94);
}

.icon-btn .ic {
  width: 18px;
  height: 18px;
}

.searchbox {
  position: relative;
  margin-top: 10px;
}

.searchbox > .ic {
  position: absolute;
  left: 13px;
  top: 50%;
  width: 18px;
  height: 18px;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}

.searchbox input {
  width: 100%;
  height: 40px;
  padding: 0 38px 0 40px;
  border: 1px solid transparent;
  border-radius: 12px;
  background: var(--surface-2);
  color: var(--ink);
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s ease, background 0.15s ease;
}

.searchbox input::placeholder {
  color: var(--muted);
}

.searchbox input:focus {
  border-color: var(--brand);
  background: var(--surface);
}

.searchbox input::-webkit-search-cancel-button {
  display: none;
}

.clear-search {
  position: absolute;
  right: 7px;
  top: 50%;
  width: 27px;
  height: 27px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: var(--muted);
  transform: translateY(-50%);
}

.clear-search:hover {
  background: var(--surface-3);
  color: var(--ink);
}

.clear-search .ic {
  width: 14px;
  height: 14px;
}

.filter-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 9px;
}

.chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
}

.chips::-webkit-scrollbar {
  display: none;
}

.chip {
  height: 30px;
  padding: 0 12px;
  flex: none;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--chip-bg);
  color: var(--ink-soft);
  font-size: 12.5px;
  font-weight: 600;
  white-space: nowrap;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}

.chip:hover {
  border-color: var(--line-strong);
}

.chip.is-active {
  border-color: var(--brand);
  background: var(--brand);
  color: var(--brand-ink);
}

.count {
  margin-left: auto;
  flex: none;
  color: var(--muted);
  font-size: 11.5px;
  font-weight: 600;
  white-space: nowrap;
}

/* --------------------------------------------------------------------------
   4. Tarjetas flotantes
   -------------------------------------------------------------------------- */
.hint {
  position: fixed;
  left: 14px;
  right: 86px;
  bottom: calc(var(--safe-bottom) + 18px);
  z-index: 16;
  max-width: 390px;
  padding: 14px 16px;
  border: 1px solid var(--panel-line);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow-md);
  animation: rise 0.35s ease both;
}

.hint h2 {
  margin: 0;
  font-family: var(--font-serif);
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.hint p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.45;
}

.hint-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 11px;
}

.preview {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: calc(var(--safe-bottom) + 12px);
  z-index: 18;
  max-width: 620px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px;
  border: 1px solid var(--panel-line);
  border-radius: 20px;
  background: var(--panel);
  box-shadow: var(--shadow-lg);
  -webkit-backdrop-filter: blur(18px) saturate(1.15);
  backdrop-filter: blur(18px) saturate(1.15);
  animation: rise 0.28s ease both;
}

.preview-thumb {
  width: 78px;
  height: 78px;
  flex: none;
  display: grid;
  place-items: center;
  overflow: hidden;
  border-radius: 14px;
  background: linear-gradient(140deg, var(--brand-soft), var(--surface-2));
  background-position: center;
  background-size: cover;
  color: var(--brand);
}

.preview-thumb .ic {
  width: 28px;
  height: 28px;
  opacity: 0.75;
}

.preview-body {
  flex: 1;
  min-width: 0;
}

.preview-title {
  margin: 0;
  overflow: hidden;
  font-family: var(--font-serif);
  font-size: 18px;
  font-weight: 600;
  line-height: 1.15;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.preview-meta {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 11.5px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.preview-actions {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 8px;
}

.preview-close {
  position: absolute;
  top: 7px;
  right: 7px;
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: var(--muted);
  background: var(--surface-2);
}

.preview-close .ic {
  width: 14px;
  height: 14px;
}

.fab {
  position: fixed;
  right: 16px;
  bottom: calc(var(--safe-bottom) + 15px);
  z-index: 20;
  height: 54px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 0 20px 0 16px;
  border-radius: 999px;
  background: linear-gradient(145deg, var(--brand), var(--brand-dark));
  color: var(--brand-ink);
  box-shadow: var(--shadow-fab);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.01em;
  transition: transform 0.18s ease, opacity 0.18s ease, box-shadow 0.18s ease;
}

.fab:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 32px rgba(14, 85, 65, 0.4);
}

.fab:active {
  transform: translateY(0) scale(0.97);
}

.fab .ic {
  width: 21px;
  height: 21px;
  stroke-width: 2.4;
}

.fab-label {
  display: inline;
}

/* Indicador de colocación en el mapa */
.placement-bar {
  position: fixed;
  left: 14px;
  right: 14px;
  top: calc(var(--safe-top) + 12px);
  z-index: 32;
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--brand);
  border-radius: 16px;
  background: var(--surface);
  box-shadow: var(--shadow-lg);
  animation: rise 0.25s ease both;
}

.placement-icon {
  width: 36px;
  height: 36px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: var(--brand);
  color: var(--brand-ink);
}

.placement-text {
  flex: 1;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.3;
}

.placement-text small {
  display: block;
  color: var(--muted);
  font-size: 11px;
  font-weight: 500;
}

/* --------------------------------------------------------------------------
   5. Overlays
   -------------------------------------------------------------------------- */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 40;
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--bg);
  -webkit-overflow-scrolling: touch;
  animation: fade 0.2s ease both;
}

.overlay-head {
  position: sticky;
  top: 0;
  z-index: 8;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(var(--safe-top) + 10px) 14px 10px;
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  border-bottom: 1px solid transparent;
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
}

.overlay-head.is-scrolled {
  border-bottom-color: var(--line);
}

.overlay-title {
  margin: 0;
  flex: 1;
  overflow: hidden;
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.01em;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.overlay-head .icon-btn {
  width: 40px;
  height: 40px;
  background: var(--surface);
}

.overlay-inner {
  width: min(100%, 760px);
  margin: 0 auto;
  padding: 0 14px calc(var(--safe-bottom) + 42px);
}

/* Detalle ---------------------------------------------------------------- */
.detail-hero {
  position: relative;
  min-height: 270px;
  height: clamp(270px, 38vh, 370px);
  display: flex;
  align-items: flex-end;
  overflow: hidden;
  background:
    radial-gradient(120% 100% at 20% 0%, var(--brand-soft), transparent 60%),
    linear-gradient(150deg, var(--surface-3), var(--surface-2));
  background-position: center;
  background-size: cover;
}

.detail-hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(5, 18, 13, 0.88) 0%, rgba(5, 18, 13, 0.34) 46%, rgba(5, 18, 13, 0.12) 100%);
}

.detail-hero-content {
  position: relative;
  z-index: 1;
  width: min(100%, 760px);
  margin: 0 auto;
  padding: 24px 22px 40px;
  color: #fff;
}

.detail-title {
  margin: 0;
  font-family: var(--font-serif);
  font-size: clamp(28px, 5.5vw, 42px);
  font-weight: 600;
  line-height: 1.02;
  letter-spacing: -0.025em;
  text-shadow: 0 2px 16px rgba(0, 0, 0, 0.4);
  overflow-wrap: anywhere;
}

.detail-sub {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-top: 9px;
  font-size: 12.5px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.88);
}

.detail-sub .dot-sep {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.6;
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 24px;
  padding: 0 9px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.16);
  border: 1px solid rgba(255, 255, 255, 0.22);
  color: #fff;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}

.tag .ic {
  width: 12px;
  height: 12px;
}

.tag.is-visited {
  background: rgba(74, 168, 132, 0.92);
  border-color: transparent;
}

.tag.is-pending {
  background: rgba(68, 85, 92, 0.86);
  border-color: transparent;
}

.tag.is-demo {
  background: #f5dd8c;
  border-color: transparent;
  color: #3b2c05;
}

.back-btn {
  position: absolute;
  top: calc(var(--safe-top) + 12px);
  left: 14px;
  z-index: 3;
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.92);
  color: #17251f;
  box-shadow: var(--shadow-sm);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}

.back-btn:hover {
  background: #fff;
}

.sheet {
  position: relative;
  z-index: 2;
  width: min(100%, 760px);
  margin: -28px auto 0;
  padding: 20px 16px 0;
  border-radius: 26px 26px 0 0;
  background: var(--bg);
  box-shadow: 0 -14px 40px rgba(0, 0, 0, 0.08);
}

.detail-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.action-btn {
  height: 38px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 0 13px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  color: var(--ink-soft);
  font-size: 12.5px;
  font-weight: 650;
  transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}

.action-btn:hover {
  border-color: var(--line-strong);
  background: var(--surface-2);
  color: var(--ink);
}

.action-btn .ic {
  width: 16px;
  height: 16px;
}

.action-btn.is-primary {
  border-color: var(--brand);
  background: var(--brand);
  color: var(--brand-ink);
}

.action-btn.is-primary:hover {
  background: var(--brand-dark);
}

.action-btn.is-danger {
  color: var(--danger);
}

.action-btn.is-danger:hover {
  border-color: var(--danger);
  background: var(--danger-soft);
}

.section {
  margin-top: 17px;
}

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 8px;
}

.section h2 {
  margin: 0;
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.section-note {
  color: var(--muted);
  font-size: 11.5px;
}

.section-body {
  color: var(--ink-soft);
  font-size: 14.5px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.info-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 7px;
}

.info-item {
  padding: 11px 12px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--surface);
}

.info-label {
  display: block;
  color: var(--muted);
  font-size: 10px;
  font-weight: 750;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.info-value {
  display: block;
  margin-top: 3px;
  color: var(--ink);
  font-size: 13.5px;
  font-weight: 600;
  overflow-wrap: anywhere;
}

.info-value.is-long {
  font-weight: 500;
  line-height: 1.5;
}

.empty-note {
  padding: 14px;
  border: 1px dashed var(--line-strong);
  border-radius: 13px;
  color: var(--muted);
  font-size: 13px;
  text-align: center;
}

.location-card {
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--surface);
}

.coords {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
  color: var(--ink-soft);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12px;
}

.coords .ic {
  width: 14px;
  height: 14px;
  color: var(--brand);
}

/* --------------------------------------------------------------------------
   6. Galería, presupuesto y formulario
   -------------------------------------------------------------------------- */
.photo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 7px;
}

.photo {
  position: relative;
  aspect-ratio: 1;
  overflow: hidden;
  border-radius: 13px;
  background: var(--surface-2) center/cover no-repeat;
  border: 1px solid var(--line);
  -webkit-tap-highlight-color: transparent;
}

.photo::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(5, 18, 13, 0.28), transparent 50%);
  opacity: 0;
  transition: opacity 0.15s ease;
}

.photo:hover::after {
  opacity: 1;
}

.photo-tag {
  position: absolute;
  left: 5px;
  top: 5px;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  height: 19px;
  padding: 0 7px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.92);
  color: #234033;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  box-shadow: 0 2px 7px rgba(0, 0, 0, 0.18);
}

.photo-tag .ic {
  width: 10px;
  height: 10px;
}

.photo-add {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  border-style: dashed;
  border-color: var(--line-strong);
  background: var(--surface);
  color: var(--muted);
  font-size: 11px;
  font-weight: 650;
}

.photo-add:hover {
  border-color: var(--brand);
  color: var(--brand);
  background: var(--brand-soft);
}

.photo-add .ic {
  width: 22px;
  height: 22px;
}

.photo-empty {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  padding: 24px 16px;
  border: 1.5px dashed var(--line-strong);
  border-radius: 15px;
  background: var(--surface);
  color: var(--muted);
  text-align: center;
  transition: border-color 0.15s ease, background 0.15s ease;
}

.photo-empty:hover {
  border-color: var(--brand);
  background: var(--brand-soft);
}

.photo-empty .ic {
  width: 27px;
  height: 27px;
  color: var(--brand);
}

.photo-empty strong {
  color: var(--ink);
  font-size: 13px;
}

.photo-empty span {
  font-size: 11.5px;
}

.photo-zone.is-dragover {
  outline: 2px dashed var(--brand);
  outline-offset: 3px;
}

.uploading {
  position: fixed;
  inset: 0;
  z-index: 75;
  display: grid;
  place-items: center;
  background: rgba(8, 20, 15, 0.45);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
}

.upload-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  border-radius: 16px;
  background: var(--surface);
  box-shadow: var(--shadow-lg);
  font-size: 13px;
  font-weight: 650;
}

.spinner {
  width: 22px;
  height: 22px;
  border: 2.5px solid var(--line);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

.budget-table {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--surface);
}

.budget-row {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr) minmax(0, 1fr);
  gap: 8px;
  align-items: center;
  padding: 7px 10px;
  border-top: 1px solid var(--line);
}

.budget-row:first-child {
  border-top: 0;
}

.budget-row.is-two {
  grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
}

.budget-row .amount {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.budget-row.is-head {
  padding-top: 9px;
  padding-bottom: 6px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 750;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.budget-row > span:first-child {
  font-size: 12.5px;
  font-weight: 600;
}

.budget-row input {
  height: 34px;
  padding: 4px 8px;
  border-radius: 8px;
  text-align: right;
  font-size: 12.5px;
}

.budget-total {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 11px 12px;
  border-top: 1px solid var(--line);
  background: var(--surface-2);
  font-size: 12.5px;
}

.budget-total b {
  font-size: 14px;
}

.budget-diff {
  color: var(--brand);
  font-weight: 700;
}

.budget-diff.is-over {
  color: var(--danger);
}

/* Formulario ------------------------------------------------------------- */
.form-wrap {
  width: min(100%, 720px);
  margin: 0 auto;
  padding: 0 14px 120px;
}

.form-intro {
  margin: 0 0 12px;
  color: var(--muted);
  font-size: 12.5px;
  line-height: 1.5;
}

.form-card {
  margin-bottom: 10px;
  padding: 15px;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: var(--surface);
}

.form-card > h2 {
  margin: 0;
  color: var(--ink);
  font-family: var(--font-serif);
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.form-card > h2 + .field {
  margin-top: 10px;
}

.field {
  margin-top: 11px;
}

.field > label,
.field-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.03em;
}

.required {
  color: var(--accent);
}

.field input,
.field select,
.field textarea {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
}

.field input,
.field select {
  height: 43px;
  padding: 0 11px;
}

.field textarea {
  min-height: 82px;
  padding: 10px 11px;
  line-height: 1.5;
  resize: vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: var(--brand);
  background: var(--surface);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 14%, transparent);
}

.field input.is-invalid,
.field select.is-invalid,
.field textarea.is-invalid {
  border-color: var(--danger);
  box-shadow: 0 0 0 3px var(--danger-soft);
}

.field-hint {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.45;
}

.field-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}

.field-row .field {
  margin-top: 11px;
}

.segmented {
  display: flex;
  gap: 3px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface-2);
}

.segmented button {
  flex: 1;
  height: 33px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  border-radius: 9px;
  color: var(--muted);
  font-size: 11.5px;
  font-weight: 700;
  transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
}

.segmented button .ic {
  width: 14px;
  height: 14px;
}

.segmented button.is-active {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 1px 4px rgba(17, 38, 29, 0.1);
}

.form-photo-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 9px;
}

.form-actions {
  position: sticky;
  bottom: 0;
  z-index: 7;
  margin: 16px -14px 0;
  padding: 10px 14px calc(var(--safe-bottom) + 10px);
  background: linear-gradient(to top, var(--bg) 60%, transparent);
}

.form-actions-inner {
  width: min(100%, 720px);
  margin: 0 auto;
  display: flex;
  gap: 8px;
}

.btn {
  height: 46px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 0 17px;
  border: 1px solid transparent;
  border-radius: 13px;
  font-size: 13.5px;
  font-weight: 700;
  transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
}

.btn .ic {
  width: 17px;
  height: 17px;
}

.btn:active {
  transform: scale(0.98);
}

.btn.is-primary {
  background: var(--brand);
  color: var(--brand-ink);
  box-shadow: 0 5px 16px rgba(14, 85, 65, 0.2);
}

.btn.is-primary:hover {
  background: var(--brand-dark);
}

.btn.is-ghost {
  border-color: var(--line);
  background: var(--surface);
  color: var(--ink-soft);
}

.btn.is-ghost:hover {
  background: var(--surface-2);
}

.btn.is-danger {
  border-color: var(--danger);
  background: var(--danger-soft);
  color: var(--danger);
}

.btn.is-block {
  width: 100%;
}

.btn.is-small {
  height: 36px;
  padding: 0 12px;
  font-size: 12px;
}

/* --------------------------------------------------------------------------
   7. Estadísticas
   -------------------------------------------------------------------------- */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.danger-zone {

}

/* --------------------------------------------------------------------------
   8. Lightbox, diálogos, avisos
   -------------------------------------------------------------------------- */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  flex-direction: column;
  background: #040907;
  color: #fff;
  animation: fade 0.18s ease both;
}

.lb-top {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(var(--safe-top) + 10px) 14px 10px;
  background: linear-gradient(to bottom, rgba(0, 0, 0, 0.55), transparent);
}

.lb-count {
  flex: 1;
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0.04em;
}

.lb-close,
.lb-nav {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.12);
  color: #fff;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}

.lb-close:hover,
.lb-nav:hover {
  background: rgba(255, 255, 255, 0.22);
}

.lb-stage {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 64px 12px 72px;
  touch-action: none;
}

.lb-img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 4px;
  box-shadow: 0 20px 80px rgba(0, 0, 0, 0.5);
  user-select: none;
  -webkit-user-drag: none;
}

.lb-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  z-index: 2;
}

.lb-nav.is-prev {
  left: 12px;
}

.lb-nav.is-next {
  right: 12px;
}

.lb-actions {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 2;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 10px 14px calc(var(--safe-bottom) + 12px);
  background: linear-gradient(to top, rgba(0, 0, 0, 0.65), transparent);
}

.lb-actions .action-btn {
  border-color: rgba(255, 255, 255, 0.18);
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
}

.lb-actions .action-btn:hover {
  background: rgba(255, 255, 255, 0.2);
}

.lb-actions .action-btn.is-danger {
  color: #ffb4ad;
}

.dialog {
  position: fixed;
  inset: 0;
  z-index: 70;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(7, 17, 13, 0.52);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
  animation: fade 0.18s ease both;
}

.dialog-card {
  width: min(100%, 390px);
  padding: 20px;
  border: 1px solid var(--panel-line);
  border-radius: 20px;
  background: var(--surface);
  box-shadow: var(--shadow-lg);
  animation: pop 0.2s ease both;
}

.dialog-card h2 {
  margin: 0;
  font-family: var(--font-serif);
  font-size: 21px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.dialog-card p {

  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
}

.dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: 7px;
  margin-top: 18px;
}

.dialog-actions .btn {
  height: 40px;
  padding: 0 14px;
  font-size: 12.5px;
}

.dialog-list {
  max-height: 52vh;
  overflow-y: auto;
  margin-top: 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
}

.dialog-list button {
  width: 100%;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  font-size: 13px;
  font-weight: 600;
}

.dialog-list button:last-child {
  border-bottom: 0;
}

.dialog-list button:hover {
  background: var(--surface-2);
}

.dialog-actions.is-stacked {

  justify-content: stretch;
}

.dialog-actions.is-stacked .btn {

}

.dialog-hint {

  padding: 10px 12px;

  font-size: 12px !important;
  line-height: 1.45 !important;
}

/* --------------------------------------------------------------------------
   8. Menú de la tuerca y copia de seguridad
   -------------------------------------------------------------------------- */
.gear-menu {
  position: fixed;
  inset: 0;
  z-index: 65;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 10px 10px calc(var(--safe-bottom) + 10px);
  background: rgba(7, 17, 13, 0.52);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
  animation: fade 0.18s ease both;
}

.gear-menu[hidden],
.busy[hidden] {
  display: none;
}

.gear-sheet {
  width: min(100%, 430px);
  max-height: calc(100vh - 20px);
  max-height: calc(100dvh - 20px - var(--safe-bottom));
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 7px 9px 10px;
  border: 1px solid var(--panel-line);
  border-radius: 24px;
  background: var(--surface);
  box-shadow: var(--shadow-lg);
  animation: sheet-up 0.24s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

.gear-grab {
  width: 38px;
  height: 4px;
  margin: 3px auto 8px;
  border-radius: 99px;
  background: var(--line);
}

.gear-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  padding: 2px 5px 7px 7px;
}

.gear-head h2 {
  margin: 0;
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.gear-head p {
  margin: 3px 0 0;
  color: var(--muted);
  font-size: 12px;
}

.gear-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.gear-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 8px;
  border: 1px solid transparent;
  border-radius: 16px;
  background: transparent;
  color: inherit;
  text-align: left;
  transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
}

.gear-item:hover {
  border-color: var(--line);
  background: var(--surface-2);
}

.gear-item:active {
  transform: scale(0.99);
}

.gear-ico {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  flex: none;
  border-radius: 14px;
  background: var(--brand-soft);
  color: var(--brand);
}

.gear-ico .ic {
  width: 20px;
  height: 20px;
}

.gear-item.is-secondary .gear-ico {
  background: var(--surface-2);
  color: var(--muted);
}

.gear-body {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.gear-title {
  color: var(--ink);
  font-size: 14px;
  font-weight: 700;
  line-height: 1.2;
}

.gear-sub {
  color: var(--muted);
  font-size: 11.5px;
  line-height: 1.35;
}

.gear-chev {
  width: 16px;
  height: 16px;
  flex: none;
  margin-left: auto;
  color: var(--muted);
  opacity: 0.7;
}

.gear-divider {
  height: 1px;
  margin: 6px 8px;
  background: var(--line);
}

@media (min-width: 720px) {
  .gear-menu {
    align-items: center;
    padding: 20px;
  }

  .gear-sheet {
    animation: pop 0.2s ease both;
  }

  .gear-grab {
    display: none;
  }
}

.busy {
  position: fixed;
  inset: 0;
  z-index: 75;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(7, 17, 13, 0.52);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
  animation: fade 0.18s ease both;
}

.busy-card {
  width: min(100%, 340px);
  padding: 24px 22px 20px;
  border: 1px solid var(--panel-line);
  border-radius: 20px;
  background: var(--surface);
  box-shadow: var(--shadow-lg);
  text-align: center;
  animation: pop 0.2s ease both;
}

.busy-spinner {
  width: 36px;
  height: 36px;
  margin: 0 auto 14px;
  border: 3px solid var(--line);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

.busy-card h2 {
  margin: 0;
  font-family: var(--font-serif);
  font-size: 19px;
  font-weight: 600;
}

.busy-card p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 12.5px;
  line-height: 1.45;
}

.busy-track {
  height: 6px;
  overflow: hidden;
  margin-top: 14px;
  border-radius: 99px;
  background: var(--surface-2);
}

.busy-track span {
  display: block;
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: var(--brand);
  transition: width 0.2s ease;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--safe-bottom) + 96px);
  z-index: 80;
  max-width: min(92vw, 460px);
  padding: 10px 15px;
  border-radius: 13px;
  background: #17251f;
  color: #f4f8f5;
  box-shadow: var(--shadow-md);
  font-size: 12.5px;
  font-weight: 600;
  line-height: 1.4;
  text-align: center;
  transform: translate(-50%, 8px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease, transform 0.18s ease;
}

.toast.is-visible {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* --------------------------------------------------------------------------
   9. Animaciones y responsive
   -------------------------------------------------------------------------- */
@keyframes fade {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pop {
  from { opacity: 0; transform: scale(0.96) translateY(6px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes sheet-up {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

<script>
/* ==========================================================================
   Mis Aventuras RD — lector y escritor ZIP mínimo, sin dependencias.
   Soporta archivos guardados (método 0) y, al leer, también deflate (método 8)
   cuando el navegador tiene DecompressionStream. No usa ZIP64 ni cifrado.
   ========================================================================== */
(function (root, factory) {
  if (typeof module === "object" && module.exports) {
    module.exports = factory();
  } else {

  "use strict";

  var MAX_ENTRIES = 10000;
  var MAX_TOTAL = 1500 * 1024 * 1024; // 1,5 GB descomprimidos
  var MAX_ZIP32 = 0xFFFFFFFF;

  var CRC_TABLE = (function () {
    var table = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) {
        c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      }
      table[n] = c >>> 0;
    }
    return table;
  }());

  function crc32(bytes) {
    var value = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) {
      value = CRC_TABLE[(value ^ bytes[i]) & 0xFF] ^ (value >>> 8);
    }
    return (value ^ 0xFFFFFFFF) >>> 0;
  }

  function toBytes(value) {
    if (value instanceof Uint8Array) return value;
    if (value instanceof ArrayBuffer) return new Uint8Array(value);
    if (Array.isArray(value)) return new Uint8Array(value);
    if (typeof value === "string") return new TextEncoder().encode(value);
    if (value && typeof value.buffer === "object" && typeof value.byteLength === "number") {
      return new Uint8Array(value.buffer, value.byteOffset || 0, value.byteLength);
    }
    throw new TypeError("Contenido de archivo no válido para el ZIP");
  }

  function dosDateTime(input) {
    var date = input instanceof Date && !isNaN(input.getTime()) ? input : new Date();
    var year = Math.min(2107, Math.max(1980, date.getFullYear()));
    var month = Math.min(12, Math.max(1, date.getMonth() + 1));
    var day = Math.min(31, Math.max(1, date.getDate()));
    var time = ((date.getHours() & 0x1F) << 11) |
      ((date.getMinutes() & 0x3F) << 5) |
      ((date.getSeconds() & 0x3F) >> 1);
    var dateValue = ((year - 1980) << 9) | (month << 5) | day;
    return { time: time & 0xFFFF, date: dateValue & 0xFFFF };
  }

  function writeU16(view, offset, value) {
    view.setUint16(offset, value & 0xFFFF, true);
  }

  function writeU32(view, offset, value) {
    view.setUint32(offset, value >>> 0, true);
  }

  /**
   * Crea un ZIP con los archivos indicados.
   * @param {Array<{name:string, data:Uint8Array|ArrayBuffer|string}>} entries
   * @param {{date?:Date, onProgress?:Function}} options

  async function create(entries, options) {
    var opts = options || {};
    var date = opts.date instanceof Date ? opts.date : new Date();
    var dos = dosDateTime(date);
    var list = [];

    if (!Array.isArray(entries) || !entries.length) {
      throw new Error("No hay archivos para crear el ZIP");
    }
    if (entries.length > MAX_ENTRIES) {
      throw new Error("La copia tiene demasiados archivos");
    }

    for (var i = 0; i < entries.length; i++) {
      var entry = entries[i] || {};
      var name = String(entry.name == null ? "" : entry.name).replace(/\\/g, "/").replace(/^\.\/+/, "");
      if (!name || name.charAt(0) === "/" || name.indexOf("../") >= 0 || name === "..") {

      }
      var nameBytes = new TextEncoder().encode(name);
      if (!nameBytes.length || nameBytes.length > 0xFFFF) {

      var data = toBytes(entry.data);
      list.push({ name: name, nameBytes: nameBytes, data: data, crc: crc32(data) });

    var localParts = [];
    var centralParts = [];
    var offset = 0;
    var centralSize = 0;
    var total = 0;

    for (var j = 0; j < list.length; j++) {
      var item = list[j];

      if (total > MAX_ZIP32) {

      var local = new Uint8Array(30 + item.nameBytes.length);
      var localView = new DataView(local.buffer);
      writeU32(localView, 0, 0x04034B50);
      writeU16(localView, 4, 20);       // versión necesaria
      writeU16(localView, 6, 0x0800);   // nombres en UTF-8
      writeU16(localView, 8, 0);        // método: guardado
      writeU16(localView, 10, dos.time);
      writeU16(localView, 12, dos.date);
      writeU32(localView, 14, item.crc);
      writeU32(localView, 18, item.data.length);
      writeU32(localView, 22, item.data.length);
      writeU16(localView, 26, item.nameBytes.length);
      writeU16(localView, 28, 0);

      localParts.push(local, item.data);

      var central = new Uint8Array(46 + item.nameBytes.length);
      var centralView = new DataView(central.buffer);
      writeU32(centralView, 0, 0x02014B50);
      writeU16(centralView, 4, 20);      // versión que lo creó
      writeU16(centralView, 6, 20);      // versión necesaria
      writeU16(centralView, 8, 0x0800);  // UTF-8
      writeU16(centralView, 10, 0);      // método: guardado
      writeU16(centralView, 12, dos.time);
      writeU16(centralView, 14, dos.date);
      writeU32(centralView, 16, item.crc);
      writeU32(centralView, 20, item.data.length);
      writeU32(centralView, 24, item.data.length);
      writeU16(centralView, 28, item.nameBytes.length);
      writeU16(centralView, 30, 0);      // extra
      writeU16(centralView, 32, 0);      // comentario
      writeU16(centralView, 34, 0);      // disco
      writeU16(centralView, 36, 0);      // atributos internos
      writeU32(centralView, 38, 0);      // atributos externos
      writeU32(centralView, 42, offset);
      central.set(item.nameBytes, 46);

      centralParts.push(central);
      centralSize += central.length;
      offset += local.length + item.data.length;

        await opts.onProgress(j + 1, list.length, item.name);

    var eocdView = new DataView(eocd.buffer);
    writeU32(eocdView, 0, 0x06054B50);
    writeU16(eocdView, 4, 0);
    writeU16(eocdView, 6, 0);
    writeU16(eocdView, 8, list.length);
    writeU16(eocdView, 10, list.length);
    writeU32(eocdView, 12, centralSize);
    writeU32(eocdView, 16, offset);
    writeU16(eocdView, 20, 0);

    var parts = localParts.concat(centralParts);
    parts.push(eocd);

      return { top: 170, right: 20, bottom: 110, left: 20 };
    };

    this.width = 0;
    this.height = 0;
    this.scale = 1;
    this.cx = -70.35;
    this.cy = mercY(18.75);
    this.homeScale = 1;
    this.minScale = 1;
    this.maxScale = 1;
    this.insets = { top: 170, right: 20, bottom: 110, left: 20 };
    this.ready = false;
    this.enabled = true;
    this.userMoved = false;

    this.pointers = new Map();
    this.drag = null;
    this.pinch = null;
    this.velocity = { x: 0, y: 0 };
    this.lastMove = null;
    this.dragMoved = false;
    this.dragStartTime = 0;
    this.inertiaFrame = null;
    this.tapTimer = null;
    this.lastTap = null;
    this.animFrame = null;

    this.bbox = {
      x0: this.geo.bbox[0],
      y0: mercY(this.geo.bbox[3]), // norte: Y menor
      x1: this.geo.bbox[2],
      y1: mercY(this.geo.bbox[1])  // sur: Y mayor
    };
    this.centerWorld = {
      x: (this.bbox.x0 + this.bbox.x1) / 2,
      y: (this.bbox.y0 + this.bbox.y1) / 2
    };

    this.buildGeometry();
    this.buildLabels();
    this.bindEvents();

    this._resizeFrame = null;
    this.resize(true);

    var self = this;
    if (typeof ResizeObserver === "function") {
      this._resizeObserver = new ResizeObserver(function () {
        if (self._resizeFrame) cancelAnimationFrame(self._resizeFrame);
        self._resizeFrame = requestAnimationFrame(function () {
          self._resizeFrame = null;
          self.resize(false);
        });
      });
      this._resizeObserver.observe(this.el);
    } else {
      window.addEventListener("resize", function () {
        self.resize(false);
      });
    }
  }

  MapView.prototype.buildGeometry = function () {
    var self = this;
    var path = this.geo.polygons.map(function (ring) {
      var parts = new Array(ring.length);
      for (var i = 0; i < ring.length; i++) {
        parts[i] = ring[i][0].toFixed(5) + " " + mercY(ring[i][1]).toFixed(5);
      }
      return "M" + parts.join("L") + "Z";
    }).join("");
    this.land.setAttribute("d", path);
    this.coastGlow.setAttribute("d", path);
    this.land.setAttribute("fill-rule", "nonzero");
    this.coastGlow.setAttribute("fill-rule", "nonzero");
    this.pathD = path;

    // Etiqueta del país y mares: posición fija en coordenadas del mundo.
    this.countryPos = { x: -70.42, y: mercY(18.88) };
    this.caribbeanPos = { x: -70.55, y: mercY(17.63) };
    this.atlanticPos = { x: -69.55, y: mercY(20.20) };
  };

  MapView.prototype.buildLabels = function () {
    var self = this;
    this.cities = CITIES.map(function (city) {
      var g = svgEl("g", { class: "city" });
      var dot = svgEl("circle", { class: "city-dot", cx: 0, cy: 0, r: 2.4 });
      var text = svgEl("text", { class: "city-text", x: 7, y: 0 });
      text.textContent = city.name;
      g.appendChild(dot);
      g.appendChild(text);
      self.cityLayer.appendChild(g);
      return { data: city, g: g, dot: dot, text: text };
    });
  };

  MapView.prototype.start = function () {
    this.ready = true;
    this.apply();
  };

  MapView.prototype.setEnabled = function (enabled) {
    this.enabled = !!enabled;
    if (!enabled) {
      this.stopInertia();
      this.cancelAnimation();
      this.pointers.clear();
      this.drag = null;
      this.pinch = null;
      this.el.classList.remove("is-dragging");
    }
  };

  MapView.prototype.resize = function (refit) {
    var width = this.el.clientWidth;
    var height = this.el.clientHeight;
    if (!width || !height) return;

    var oldHome = this.homeScale || 1;
    var wasHome = !this.userMoved || Math.abs(this.scale / oldHome - 1) < 0.08;

    this.width = width;
    this.height = height;
    this.svg.setAttribute("viewBox", "0 0 " + width + " " + height);
    this.insets = this.getInsets();

    var fit = this.computeFit();
    this.homeScale = fit.scale;
    this.minScale = fit.scale * 0.72;
    this.maxScale = fit.scale * 30;

    if (refit || wasHome) {
      this.scale = fit.scale;
      this.cx = fit.cx;
      this.cy = fit.cy;
      this.userMoved = false;
    } else {
      this.scale = clamp(this.scale, this.minScale, this.maxScale);
      this.constrain();
    }
    this.apply();
  };

  MapView.prototype.computeFit = function () {
    var width = this.width;
    var height = this.height;
    var insets = this.insets;
    var availW = Math.max(120, width - insets.left - insets.right);
    var availH = Math.max(120, height - insets.top - insets.bottom);
    var bw = this.bbox.x1 - this.bbox.x0;
    var bh = this.bbox.y1 - this.bbox.y0;
    var scale = Math.min(availW / bw, availH / bh) * 0.955;
    var cx = (this.bbox.x0 + this.bbox.x1) / 2;
    var desiredCenterY = insets.top + availH / 2;
    var cy = this.centerWorld.y - (desiredCenterY - height / 2) / scale;
    return { scale: scale, cx: cx, cy: cy };
  };

  MapView.prototype.constrain = function () {
    var pad = this.scale < this.homeScale * 1.25 ? 0.35 : 1.4;
    this.cx = clamp(this.cx, this.bbox.x0 - pad, this.bbox.x1 + pad);
    this.cy = clamp(this.cy, this.bbox.y0 - pad, this.bbox.y1 + pad);
  };

  MapView.prototype.project = function (lon, lat) {
    return { x: lon, y: mercY(lat) };
  };

  MapView.prototype.unproject = function (x, y) {
    return {
      lon: this.cx + (x - this.width / 2) / this.scale,
      lat: invMercY(this.cy + (y - this.height / 2) / this.scale)
    };
  };

  MapView.prototype.screen = function (lon, lat) {
    var p = this.project(lon, lat);
    return {
      x: this.width / 2 + (p.x - this.cx) * this.scale,
      y: this.height / 2 + (p.y - this.cy) * this.scale
    };
  };

  MapView.prototype.apply = function () {
    if (!this.width || !this.height) return;
    var tx = this.width / 2 - this.cx * this.scale;
    var ty = this.height / 2 - this.cy * this.scale;
    this.world.setAttribute(
      "transform",
      "translate(" + tx.toFixed(3) + " " + ty.toFixed(3) + ") scale(" + this.scale.toFixed(6) + ")"
    );
    this.updateLabels();
    if (this.ready) this.onView(this);
  };

  MapView.prototype.updateLabels = function () {
    var scale = this.scale;
    var ratio = scale / this.homeScale;

    var countrySize = 22 / scale;
    this.countryLabel.setAttribute("font-size", countrySize);
    this.countryLabel.setAttribute("stroke-width", 3.2 / scale);
    this.countryLabel.setAttribute(
      "transform",
      "translate(" + this.countryPos.x + " " + this.countryPos.y + ")"
    );
    this.countryLabel.style.opacity = String(clamp(1 - (ratio - 1) / 2.2, 0, 1) * 0.3);

    this.seaCaribbean.setAttribute("font-size", 11.5 / scale);
    this.seaCaribbean.setAttribute("stroke-width", 3 / scale);
    this.seaCaribbean.setAttribute(
      "transform",
      "translate(" + this.caribbeanPos.x + " " + this.caribbeanPos.y + ")"
    );
    this.seaCaribbean.style.opacity = String(clamp(1 - (ratio - 1) / 2.6, 0, 1) * 0.46);

    this.seaAtlantic.setAttribute("font-size", 11.5 / scale);
    this.seaAtlantic.setAttribute("stroke-width", 3 / scale);
    this.seaAtlantic.setAttribute(
      "transform",
      "translate(" + this.atlanticPos.x + " " + this.atlanticPos.y + ")"
    );
    this.seaAtlantic.style.opacity = String(clamp(1 - (ratio - 1) / 2.6, 0, 1) * 0.46);

    var size = 11.5 / scale;
    for (var i = 0; i < this.cities.length; i++) {
      var item = this.cities[i];
      var start = item.data.tier === 1 ? 1.22 : 2.05;
      var opacity = clamp((ratio - start) / 0.38, 0, 1) * 0.92;
      if (opacity < 0.025) {
        item.g.style.display = "none";
        continue;
      }
      item.g.style.display = "";
      item.g.style.opacity = String(opacity);
      var p = this.project(item.data.lon, item.data.lat);
      item.g.setAttribute("transform", "translate(" + p.x.toFixed(5) + " " + p.y.toFixed(5) + ")");
      item.dot.setAttribute("r", (2.3 / scale).toFixed(5));
      item.dot.setAttribute("stroke-width", (1.2 / scale).toFixed(5));
      item.text.setAttribute("font-size", size.toFixed(5));
      item.text.setAttribute("x", (7 / scale).toFixed(5));
      item.text.setAttribute("stroke-width", (3 / scale).toFixed(5));
    }
  };

  MapView.prototype.cancelAnimation = function () {
    if (this.animFrame) {
      cancelAnimationFrame(this.animFrame);
      this.animFrame = null;
    }
  };

  MapView.prototype.stopInertia = function () {
    if (this.inertiaFrame) {
      cancelAnimationFrame(this.inertiaFrame);
      this.inertiaFrame = null;
    }
  };

  MapView.prototype.zoomBy = function (factor, animate) {
    var target = clamp(this.scale * factor, this.minScale, this.maxScale);
    if (Math.abs(target - this.scale) < 0.0001) return;
    if (animate) {
      this.animateTo(this.cx, this.cy, target, 260);
    } else {
      this.scale = target;
      this.constrain();
      this.apply();
    }
    this.userMoved = true;
  };

  MapView.prototype.zoomAt = function (factor, sx, sy, animate) {
    var target = clamp(this.scale * factor, this.minScale, this.maxScale);
    if (Math.abs(target - this.scale) < 0.0001) return;
    var world = this.project(this.cx + (sx - this.width / 2) / this.scale, invMercY(this.cy + (sy - this.height / 2) / this.scale));
    var nextCx = world.x - (sx - this.width / 2) / target;
    var nextCy = world.y - (sy - this.height / 2) / target;
    this.userMoved = true;
    if (animate) {
      this.animateTo(nextCx, nextCy, target, 260);
    } else {
      this.scale = target;
      this.cx = nextCx;
      this.cy = nextCy;
      this.constrain();
      this.apply();
    }
  };

  MapView.prototype.animateTo = function (cx, cy, scale, duration, done) {
    var self = this;
    this.cancelAnimation();
    this.stopInertia();
    var start = { cx: this.cx, cy: this.cy, scale: this.scale };
    var target = {
      cx: clamp(cx, this.bbox.x0 - 1.4, this.bbox.x1 + 1.4),
      cy: clamp(cy, this.bbox.y0 - 1.4, this.bbox.y1 + 1.4),
      scale: clamp(scale, this.minScale, this.maxScale)
    };
    var t0 = performance.now();
    var durationMs = duration || 360;

    function frame(now) {
      var t = Math.min(1, (now - t0) / durationMs);
      var e = easeInOutCubic(t);
      self.cx = start.cx + (target.cx - start.cx) * e;
      self.cy = start.cy + (target.cy - start.cy) * e;
      self.scale = start.scale + (target.scale - start.scale) * e;
      self.apply();
      if (t < 1) {
        self.animFrame = requestAnimationFrame(frame);
      } else {
        self.animFrame = null;
        if (typeof done === "function") done();
      }
    }
    this.animFrame = requestAnimationFrame(frame);
  };

  MapView.prototype.home = function (animate) {
    var fit = this.computeFit();
    this.userMoved = false;
    if (animate === false) {
      this.scale = fit.scale;
      this.cx = fit.cx;
      this.cy = fit.cy;
      this.apply();
    } else {
      this.animateTo(fit.cx, fit.cy, fit.scale, 460, function () {
        // Mantener la vista como "vista general" aunque se redimensione.
      });
    }
  };

  MapView.prototype.flyTo = function (lon, lat, scale, duration) {
    var p = this.project(lon, lat);
    this.userMoved = true;
    this.animateTo(p.x, p.y, scale || Math.max(this.scale, this.homeScale * 2.4), duration || 420);
  };

  MapView.prototype.ensureVisible = function (lon, lat, padding) {
    if (!this.width || !this.height) return;
    var p = this.screen(lon, lat);
    var pad = padding || 90;
    var top = this.insets.top + 30;
    var bottom = this.height - 120;
    if (p.x < pad || p.x > this.width - pad || p.y < top || p.y > bottom) {
      var pWorld = this.project(lon, lat);
      var scale = Math.max(this.scale, this.homeScale * 1.45);
      this.userMoved = true;
      this.animateTo(pWorld.x, pWorld.y, scale, 400);
    }
  };

  MapView.prototype.bindEvents = function () {
    var self = this;

    this.el.addEventListener("pointerdown", function (event) {
      self.onPointerDown(event);
    });
    this.el.addEventListener("pointermove", function (event) {
      self.onPointerMove(event);
    });
    this.el.addEventListener("pointerup", function (event) {
      self.onPointerUp(event);
    });
    this.el.addEventListener("pointercancel", function (event) {
      self.onPointerCancel(event);
    });

    this.el.addEventListener("wheel", function (event) {
      if (!self.enabled) return;
      event.preventDefault();
      self.stopInertia();
      self.cancelAnimation();
      var delta = event.deltaY;
      if (event.deltaMode === 1) delta *= 16;
      else if (event.deltaMode === 2) delta *= 100;
      var factor = Math.exp(-delta * (event.ctrlKey ? 0.012 : 0.0018));
      factor = clamp(factor, 0.45, 2.2);
      self.zoomAt(factor, event.clientX, event.clientY, false);
    }, { passive: false });

    this.el.addEventListener("keydown", function (event) {
      if (!self.enabled) return;
      var key = event.key;
      var handled = true;
      if (key === "+" || key === "=") {
        self.zoomBy(1.5, true);
      } else if (key === "-" || key === "_") {
        self.zoomBy(0.66, true);
      } else if (key === "0" || key === "Home") {
        self.home(true);
      } else if (key === "ArrowLeft") {
        self.cx -= 90 / self.scale;
        self.constrain();
        self.apply();
      } else if (key === "ArrowRight") {
        self.cx += 90 / self.scale;
        self.constrain();
        self.apply();
      } else if (key === "ArrowUp") {
        self.cy += 90 / self.scale;
        self.constrain();
        self.apply();
      } else if (key === "ArrowDown") {
        self.cy -= 90 / self.scale;
        self.constrain();
        self.apply();
      } else {
        handled = false;
      }
      if (handled) {
        self.userMoved = true;
        event.preventDefault();
      }
    });
  };

  MapView.prototype.onPointerDown = function (event) {
    if (!this.enabled) return;
    if (event.pointerType === "mouse" && event.button !== 0) return;
    if (event.target.closest && event.target.closest("button, a, input, select, textarea, .marker-card, .cluster-dot")) {
      return;
    }

    this.cancelAnimation();
    this.stopInertia();
    if (this.tapTimer) {
      clearTimeout(this.tapTimer);
      this.tapTimer = null;
    }

    try {
      this.el.setPointerCapture(event.pointerId);
    } catch (error) { /* algunos navegadores no lo permiten */ }

    this.pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    this.dragMoved = false;
    this.dragStartTime = performance.now();

    if (this.pointers.size === 1) {
      this.drag = { x: event.clientX, y: event.clientY };
      this.lastMove = { x: event.clientX, y: event.clientY, t: performance.now() };
      this.velocity = { x: 0, y: 0 };
      this.el.classList.add("is-dragging");
    } else if (this.pointers.size === 2) {
      this.startPinch();
      this.el.classList.add("is-dragging");
    }
  };

  MapView.prototype.startPinch = function () {
    var pts = Array.from(this.pointers.values());
    if (pts.length < 2) return;
    var center = midpoint(pts[0], pts[1]);
    var world = this.unproject(center.x, center.y);
    this.pinch = {
      dist: Math.max(1, distance(pts[0], pts[1])),
      scale: this.scale,
      world: this.project(world.lon, world.lat)
    };
    this.drag = null;
  };

  MapView.prototype.onPointerMove = function (event) {
    if (!this.enabled) return;
    if (!this.pointers.has(event.pointerId)) return;
    var previous = this.pointers.get(event.pointerId);
    this.pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

    if (this.pointers.size >= 2) {
      var pts = Array.from(this.pointers.values()).slice(0, 2);
      var center = midpoint(pts[0], pts[1]);
      var dist = Math.max(1, distance(pts[0], pts[1]));
      if (!this.pinch) {
        this.startPinch();
      } else {
        var targetScale = clamp(this.pinch.scale * (dist / this.pinch.dist), this.minScale, this.maxScale);
        this.scale = targetScale;
        this.cx = this.pinch.world.x - (center.x - this.width / 2) / this.scale;
        this.cy = this.pinch.world.y - (center.y - this.height / 2) / this.scale;
        this.constrain();
        this.dragMoved = true;
        this.userMoved = true;
        this.apply();
      }
      return;
    }

    if (this.pointers.size === 1 && this.drag) {
      var dx = event.clientX - previous.x;
      var dy = event.clientY - previous.y;
      if (Math.abs(dx) + Math.abs(dy) < 0.01) return;

      this.cx -= dx / this.scale;
      this.cy -= dy / this.scale;
      this.constrain();
      this.apply();

      var now = performance.now();
      var dt = Math.max(1, now - this.lastMove.t);
      this.velocity = {
        x: (event.clientX - this.lastMove.x) / dt,
        y: (event.clientY - this.lastMove.y) / dt
      };
      this.lastMove = { x: event.clientX, y: event.clientY, t: now };
      if (Math.abs(dx) + Math.abs(dy) > 3) this.dragMoved = true;
      this.userMoved = true;
    }
  };

  MapView.prototype.onPointerUp = function (event) {
    if (!this.pointers.has(event.pointerId)) return;
    this.pointers.delete(event.pointerId);

    if (this.pointers.size === 0) {
      this.el.classList.remove("is-dragging");
      var wasMoved = this.dragMoved;
      var duration = performance.now() - this.dragStartTime;

      if (!wasMoved && duration < 700) {
        this.handleTap(event.clientX, event.clientY);
      } else if (wasMoved) {
        var speed = Math.hypot(this.velocity.x, this.velocity.y);
        if (speed > 0.18) this.startInertia();
      }
      this.drag = null;
      this.pinch = null;
    } else if (this.pointers.size === 1) {
      var pt = Array.from(this.pointers.values())[0];
      this.drag = { x: pt.x, y: pt.y };
      this.lastMove = { x: pt.x, y: pt.y, t: performance.now() };
      this.pinch = null;
      this.velocity = { x: 0, y: 0 };
    }
  };

  MapView.prototype.onPointerCancel = function (event) {
    this.pointers.delete(event.pointerId);
    if (this.pointers.size === 0) {
      this.el.classList.remove("is-dragging");
      this.drag = null;
      this.pinch = null;
    }
  };

  MapView.prototype.handleTap = function (x, y) {
    var self = this;
    var now = performance.now();
    if (this.lastTap && now - this.lastTap.t < 330 && Math.hypot(x - this.lastTap.x, y - this.lastTap.y) < 32) {
      this.lastTap = null;
      if (this.tapTimer) {
        clearTimeout(this.tapTimer);
        this.tapTimer = null;
      }
      this.zoomAt(1.9, x, y, true);
      return;
    }
    this.lastTap = { x: x, y: y, t: now };
    if (this.tapTimer) clearTimeout(this.tapTimer);
    this.tapTimer = setTimeout(function () {
      self.tapTimer = null;
      var point = self.unproject(x, y);
      self.onClick({
        lon: point.lon,
        lat: point.lat,
        screenX: x,
        screenY: y
      });
    }, 245);
  };

  MapView.prototype.startInertia = function () {
    var self = this;
    this.stopInertia();
    var vx = this.velocity.x;
    var vy = this.velocity.y;
    var last = performance.now();

    function step(now) {
      var dt = Math.min(34, now - last);
      last = now;
      self.cx -= (vx * dt) / self.scale;
      self.cy -= (vy * dt) / self.scale;
      self.constrain();
      self.apply();
      var decay = Math.pow(0.9, dt / 16);
      vx *= decay;
      vy *= decay;
      if (Math.abs(vx) < 0.02 && Math.abs(vy) < 0.02) {
        self.inertiaFrame = null;
        return;
      }
      self.inertiaFrame = requestAnimationFrame(step);
    }
    this.inertiaFrame = requestAnimationFrame(step);
  };

  window.MapView = MapView;
})();

</script>

  function openDatabase(name, version, upgrade) {
    return new Promise(function (resolve, reject) {
      var request;
      try {
        request = indexedDB.open(name, version);
      } catch (error) {
        reject(error);
        return;
      }
      request.onupgradeneeded = function (event) {
        if (typeof upgrade === "function") upgrade(request.result, event);
      };
      request.onsuccess = function () {
        resolve(request.result);
      };
      request.onerror = function () {
        reject(request.error || new Error("No se pudo abrir IndexedDB"));
      };
      request.onblocked = function () {
        reject(new Error("IndexedDB bloqueado"));
      };
    });
  }

  function getDatabase() {
    if (!dbPromise) {
      dbPromise = openDatabase(DB_NAME, DB_VERSION, function (db) {
        if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
      });
    }
    return dbPromise;
  }

  function readDatabase(db, store, key) {
    return new Promise(function (resolve, reject) {
      try {
        var transaction = db.transaction(store, "readonly");
        var request = transaction.objectStore(store).get(key);
        request.onsuccess = function () { resolve(request.result); };
        request.onerror = function () { reject(request.error || transaction.error); };
      } catch (error) {
        reject(error);
      }
    });
  }

  function writeDatabase(db, store, key, value) {
    return new Promise(function (resolve, reject) {
      try {
        var transaction = db.transaction(store, "readwrite");
        transaction.objectStore(store).put(value, key);
        transaction.oncomplete = function () { resolve(true); };
        transaction.onerror = function () { reject(transaction.error || new Error("Error de escritura")); };
        transaction.onabort = function () { reject(transaction.error || new Error("Escritura abortada")); };
      } catch (error) {
        reject(error);
      }
    });
  }

  async function readLegacyState() {
    if (!window.indexedDB) return null;
    try {
      if (indexedDB.databases) {
        var databases = await indexedDB.databases();
        var exists = databases.some(function (db) { return db.name === LEGACY_DB; });
        if (!exists) return null;
      }
      var legacy = await openDatabase(LEGACY_DB, 1);
      if (!legacy.objectStoreNames.contains("kv")) {
        legacy.close();
        return null;
      }
      var state = await readDatabase(legacy, "kv", "state");
      legacy.close();
      return state || null;
    } catch (error) {
      return null;
    }
  }

  async function loadState() {
    var raw = null;
    var source = "";
    try {
      var db = await getDatabase();
      raw = await readDatabase(db, DB_STORE, DB_KEY);
      if (raw) source = "idb";
    } catch (error) {
      raw = null;
    }

    var localRaw = null;
    try {
      localRaw = JSON.parse(localStorage.getItem(LS_STATE) || "null");
    } catch (error) {
      localRaw = null;
    }

    // Si el último guardado cayó al respaldo de localStorage, ese estado es
    // más nuevo que lo que quedó en IndexedDB. No lo perdamos al recargar.
    if (raw && localRaw && number(localRaw.updatedAt) > number(raw.updatedAt)) {
      raw = localRaw;
      source = "local";
    }
    if (!raw && localRaw) {
      raw = localRaw;
      source = "local";
    }
    if (!raw) {
      raw = await readLegacyState();
      if (raw) source = "legacy";
    }
    return { state: normalizeState(raw), source: source };
  }

  async function doPersist() {

    try {
      var db = await getDatabase();

        return true;
      } catch (storageError) {
        toast("No se pudo guardar. Libera espacio o exporta una copia de seguridad.");
        return false;
      }
    }
  }

    saveChain = saveChain.then(doPersist, doPersist);

  function currentTheme() {
    return S.settings && S.settings.theme ? S.settings.theme : "auto";

  function effectiveTheme() {
    var theme = currentTheme();
    if (theme === "auto") {
      return mediaDark && mediaDark.matches ? "dark" : "light";
    }
    return theme;
  }

  function applyTheme() {
    var theme = currentTheme();
    if (theme === "auto") {
      document.documentElement.removeAttribute("data-theme");
    } else {
      document.documentElement.dataset.theme = theme;
    }
    try {
      if (theme === "auto") localStorage.removeItem(LS_THEME);
      else localStorage.setItem(LS_THEME, theme);
    } catch (error) { /* sin permisos */ }

    var use = document.querySelector("#theme-icon use");
    if (use) use.setAttribute("href", effectiveTheme() === "dark" ? "#i-sun" : "#i-moon");

    var meta = $("meta-theme");
    if (meta) meta.setAttribute("content", effectiveTheme() === "dark" ? "#111a16" : "#f7f3ea");

    document.querySelectorAll("[data-theme-value]").forEach(function (button) {
      button.classList.toggle("is-active", button.dataset.themeValue === theme);
    });
  }

  function onDocumentClick(event) {
    var actionEl = event.target.closest("[data-action]");
    if (!actionEl || actionEl.disabled) return;
